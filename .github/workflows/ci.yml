name: CI

on:
  push:
    branches: [ main, "feat/*" ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libbpf-dev \
          libxdp-dev \
          pkg-config \
          cmake \
          build-essential \
          libclang-dev
        
    - name: Build
      run: cargo build --workspace --exclude flux-engine-dpdk --exclude flux-engine-afxdp --verbose
      
    - name: Run Unit Tests
      run: cargo test --workspace --exclude flux-engine-dpdk --exclude flux-engine-afxdp --verbose
      
    - name: Run Integration Tests (Cucumber)
      run: cargo run -p flux-integration-tests --verbose
